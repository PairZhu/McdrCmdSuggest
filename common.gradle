apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

def mcVersionParts = project.minecraft_version.split('\\.') as List
if (mcVersionParts.size() == 2) {
    mcVersionParts += '0'
}
int mcVersion = mcVersionParts.collect { it.padLeft(2, '0') }.join('') as Integer
boolean usesUnobfuscatedMinecraft = mcVersion >= 260100

apply plugin: usesUnobfuscatedMinecraft ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

sourceSets {
    main {
        resources.setSrcDirs([rootProject.file('src/main/resources'), file('src/main/resources')])
        java.srcDir(rootProject.file('src/core/java'))
        if (usesUnobfuscatedMinecraft) {
            java.srcDir(rootProject.file('versions/shared/mojang/java'))
        } else {
            def commandApiSources
            if (mcVersion >= 11900) {
                commandApiSources = rootProject.file('versions/shared/fabric-command-v2/java')
            } else if (mcVersion >= 11600) {
                commandApiSources = rootProject.file('versions/shared/fabric-command-v1/java')
            } else {
                commandApiSources = rootProject.file('versions/shared/fabric-command-registry/java')
            }
            if (mcVersion < 11700) {
                java.srcDir(rootProject.file('versions/shared/yarn-legacy-command/java'))
            } else if (mcVersion < 11800) {
                java.srcDir(rootProject.file('versions/shared/yarn-command/java'))
                java.srcDir(rootProject.file('versions/shared/yarn-server-legacy/java'))
            } else {
                java.srcDir(rootProject.file('versions/shared/yarn-command/java'))
                java.srcDir(rootProject.file('versions/shared/yarn-server-modern/java'))
            }
            java.srcDir(commandApiSources)
        }
    }
}

repositories {
    maven {
        url = 'https://masa.dy.fi/maven'
    }
    maven {
        url = 'https://maven.fallenbreath.me/releases'
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://www.cursemaven.com'
    }
}

// https://github.com/FabricMC/fabric-loader/issues/783
configurations {
    if (!usesUnobfuscatedMinecraft) {
        modRuntimeOnly.exclude group: 'net.fabricmc', module: 'fabric-loader'
        modCompileOnly.exclude group: 'com.github.2No2Name', module: 'McTester'
        modImplementation.exclude group: 'com.github.2No2Name', module: 'McTester'
    }
}

dependencies {
    // loom
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!usesUnobfuscatedMinecraft) {
        if (project.hasProperty('yarn_mappings') && project.yarn_mappings.toString().trim()) {
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        } else {
            mappings loom.officialMojangMappings()
        }
    }
    "${usesUnobfuscatedMinecraft ? 'implementation' : 'modImplementation'}" "net.fabricmc:fabric-loader:${project.loader_version}"
    if (project.hasProperty('fabric_api_version')) {
        "${usesUnobfuscatedMinecraft ? 'implementation' : 'modImplementation'}" "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }
    // 兼容旧版本
    if (project.hasProperty('fabric_api_old_version')) {
        "${usesUnobfuscatedMinecraft ? 'implementation' : 'modImplementation'}" "net.fabricmc:fabric:${project.fabric_api_old_version}"
    }
    
    // FastJson2
    implementation "com.alibaba.fastjson2:fastjson2:2.0.43"
    shadow "com.alibaba.fastjson2:fastjson2:2.0.43"
}

JavaVersion JAVA_COMPATIBILITY
if (mcVersion >= 260100) {
    JAVA_COMPATIBILITY = JavaVersion.VERSION_25
} else if (mcVersion >= 12005) {
    JAVA_COMPATIBILITY = JavaVersion.VERSION_21
} else if (mcVersion >= 11800) {
    JAVA_COMPATIBILITY = JavaVersion.VERSION_17
} else if (mcVersion >= 11700) {
    JAVA_COMPATIBILITY = JavaVersion.VERSION_16
} else {
    JAVA_COMPATIBILITY = JavaVersion.VERSION_1_8
}

loom {
    runConfigs.configureEach {
        runDir '../../run'
        ideConfigGenerated true
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude("META-INF")
    archiveClassifier.set(usesUnobfuscatedMinecraft ? '' : 'shadow')
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

tasks.withType(ShadowJar).configureEach {
    enableAutoRelocation = true
    relocationPrefix = 'mcdrcmdsuggest.libs'
}

if (usesUnobfuscatedMinecraft) {
    jar {
        enabled = false
    }
    assemble {
        dependsOn(shadowJar)
    }
} else {
    remapJar {
        dependsOn(shadowJar)
        mustRunAfter(shadowJar)
        inputFile = shadowJar.archiveFile
    }
}

String modVersionSuffix = ''
// detect github action environment variables
// https://docs.github.com/en/actions/learn-github-actions/environment-variables#default-environment-variables
// 要使这段代码发挥作用，需要在Github Action的构建运行时在env中添加 BUILD_RELEASE: "true"
if (System.getenv("BUILD_RELEASE") != "true") {
    String buildNumber = System.getenv("BUILD_ID")
    modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
}
String fullModVersion = project.mod_version + modVersionSuffix
String fullProjectVersion

// Example version values:
//   project.mod_version     1.0.3                      (the base mod version)
//   modVersionSuffix        +build.88                  (use github action build number if possible)
//   artifactVersionSuffix   -SNAPSHOT
//   fullModVersion          1.0.3+build.88             (the actual mod version to use in the mod)
//   fullProjectVersion      v1.0.3-mc1.15.2+build.88   (in build output jar name)
//   fullArtifactVersion     1.0.3-mc1.15.2-SNAPSHOT    (maven artifact version)

// 这部分可以自定义，前提是理解了代码内容
group = project.maven_group
if (System.getenv("JITPACK") == "true") {
    // move mc version into archivesBaseName, so jitpack will be able to organize archives from multiple subprojects correctly
    base.archivesName = project.archives_base_name + '-mc' + project.minecraft_version
    fullProjectVersion = 'v' + project.mod_version + modVersionSuffix
} else {
    base.archivesName = project.archives_base_name
    fullProjectVersion = 'v' + project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
}
version = fullProjectVersion

// See https://youtrack.jetbrains.com/issue/IDEA-296490
// if IDEA complains about "Cannot resolve resource filtering of MatchingCopyAction" and you want to know why
processResources {
    def modId = project.mod_id
    def modName = project.mod_name
    def minecraftVersion = project.minecraft_version
    def loaderVersion = project.loader_version
    def minecraftDependency = project.minecraft_dependency
    def fabricDependency = project.hasProperty('fabric_dependency') ? project.fabric_dependency : 'fabric'
    
    inputs.property "id", modId
    inputs.property "name", modName
    inputs.property "version", fullModVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "fabric_dependency", fabricDependency

    filesMatching("fabric.mod.json") {
        def valueMap = [
                "id"               : modId,
                "name"             : modName,
                "version"          : fullModVersion,
                "minecraft_version": minecraftVersion,
                "loader_version"   : loaderVersion,
                "fabric_dependency": fabricDependency,
                "minecraft_dependency": minecraftDependency
        ]

        expand valueMap
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    if (JAVA_COMPATIBILITY <= JavaVersion.VERSION_1_8) {
        // suppressed "source/target value 8 is obsolete and will be removed in a future release"
        options.compilerArgs << '-Xlint:-options'
    }
}

java {
    sourceCompatibility = JAVA_COMPATIBILITY
    targetCompatibility = JAVA_COMPATIBILITY
    if (usesUnobfuscatedMinecraft) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(26)
        }
    }
}

jar {
    def archivesBaseName = project.archives_base_name
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${archivesBaseName}" }
    }
}
